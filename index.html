<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy birthday, Mom · A day trip to Bagni di Lucca</title>
  <meta name="description" content="A pixel-art birthday day trip: a walk through Lucca, breakfast in the square, a drive up the valley and a spa day in the marble baths of Bagni di Lucca.">
  <!-- A family surprise: kept out of search results. Remove this line to allow indexing. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2e5233">
  <link rel="canonical" href="https://debruynbrycedbb.github.io/mom-bday-daytrip/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Happy birthday, Mom">
  <meta property="og:description" content="Your day out: Lucca to the marble baths of Bagni di Lucca.">
  <meta property="og:image" content="https://debruynbrycedbb.github.io/mom-bday-daytrip/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen&display=swap">
  <link rel="stylesheet" href="css/style.css?v=2">
  
  <script type="module" src="js/main.js?v=2"></script>
</head>
<body>
  <main>
    <h1 class="sr-only">Happy birthday, Mom: your day trip</h1>

    <canvas id="map" aria-hidden="true"></canvas>
    <div id="overlay" class="overlay" aria-label="Stops on the map" role="group"></div>

    <header class="top-hud">
      <p class="brand"><span aria-hidden="true">♥</span> Mom’s day out</p>
      <button id="recenter" class="btn btn-small" type="button" hidden>Back to the family</button>
    </header>

    <button id="sound" class="btn btn-small btn-sound" type="button" aria-pressed="false">
      <svg viewBox="0 0 10 10" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges">
        <path fill="currentColor" d="M1 3h2v4H1zM3 3h1V2h1V1h1v8H5V8H4V7H3z"/>
        <path class="waves" fill="currentColor" d="M7 4h1v2H7zM8 2h1v1H8zM8 7h1v1H8zM9 3h1v4H9z"/>
      </svg>
      <span class="label">Sound off</span>
    </button>

    <nav class="hud" aria-label="Journey">
      <ol class="pips" id="pips"></ol>
      <p class="status" id="status" aria-live="polite"></p>
      <button id="go" class="btn btn-go" type="button">Walk into Lucca</button>
    </nav>

    <section id="card" class="card" role="dialog" aria-modal="true" aria-labelledby="card-title" hidden>
      <div class="card-inner">
        <p class="kicker" id="card-kicker"></p>
        <h2 id="card-title"></h2>
        <div class="scene-frame">
          <canvas id="scene" role="img" aria-label=""></canvas>
        </div>
        <div class="card-body" id="card-body"></div>
        <dl class="details" id="card-details"></dl>
        <div class="card-actions">
          <button id="card-close" class="btn" type="button">Back to the map</button>
          <button id="card-replay" class="btn btn-quiet" type="button" hidden>Replay the day</button>
        </div>
      </div>
    </section>

    <section id="title" class="title-screen" aria-labelledby="title-heading">
      <canvas id="title-bg" aria-hidden="true"></canvas>
      <div class="title-content">
        <p class="kicker">A day trip for your birthday</p>
        <h2 id="title-heading" class="title-heading">Happy birthday, <span>Mom</span></h2>
        <p class="title-sub">A walk through Lucca, breakfast in the square, then a drive up the valley to the marble baths of Bagni di Lucca.</p>
        <p class="title-date"><span class="ph">[Date of the trip]</span></p>
        <button id="start" class="btn btn-go" type="button" disabled>Loading…</button>
      </div>
      <div class="party" aria-hidden="true">
        <img src="assets/img/dog1.png" width="68" height="48" alt="" style="--d:0s">
        <img src="assets/img/mom.png" width="63" height="96" alt="" style="--d:.2s">
        <img src="assets/img/dad.png" width="90" height="96" alt="" style="--d:.45s">
        <img src="assets/img/dog2.png" width="54" height="48" alt="" style="--d:.1s">
      </div>
    </section>

    <noscript>
      <p class="noscript">This birthday trip is an animated map, so it needs JavaScript turned on.</p>
    </noscript>
  </main>
</body>
</html>
